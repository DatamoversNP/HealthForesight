version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: uepi-postgres
    environment:
      POSTGRES_USER: uepi
      POSTGRES_PASSWORD: uepi123
      POSTGRES_DB: uepi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uepi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uepi-network

  redis:
    image: redis:7-alpine
    container_name: uepi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uepi-network

  minio:
    image: minio/minio:latest
    container_name: uepi-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - uepi-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  uepi-network:
    driver: bridge
