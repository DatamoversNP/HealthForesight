[tool.poetry]
name = "uepi-api"
version = "0.1.0"
description = "UEPI API Service"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-multipart = "^0.0.6"
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
httpx = "^0.25.0"
requests = "^2.31.0"  # For daily job scripts
psycopg2-binary = "^2.9.9"  # For PostgreSQL
redis = "^5.0.1"
celery = {extras = ["redis"], version = "^5.3.0"}
boto3 = "^1.29.0"
polars = "^0.19.0"
azure-storage-file-share = "^12.17.0"  # For Azure File Storage (simple file system)
pyarrow = "^14.0.0"
pandas = "^2.1.0"
scipy = "^1.10.0"
scikit-learn = "^1.3.0"
statsmodels = "^0.14.0"
# OpenTelemetry temporarily disabled due to Python 3.14 compatibility issues
# opentelemetry-api = "^1.21.0"
# opentelemetry-sdk = "^1.21.0"
# opentelemetry-instrumentation-fastapi = "^0.42b0"
# opentelemetry-instrumentation-sqlalchemy = "^0.42b0"
# opentelemetry-exporter-otlp = "^1.21.0"
prometheus-client = "^0.19.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
httpx = "^0.25.0"
ruff = "^0.1.6"
mypy = "^1.7.0"

