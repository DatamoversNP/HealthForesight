<svg
  width="420"
  height="96"
  viewBox="0 0 420 96"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="HealthForesight by DataMovers logo"
>
  <!-- Symbol -->
  <g transform="translate(0,16)">
    <!-- Outer lens -->
    <circle
      cx="32"
      cy="32"
      r="28"
      fill="none"
      stroke="#3B2F8F"
      stroke-width="4"
    />
    <!-- Forward arc -->
    <path
      d="M32 4
         A28 28 0 0 1 60 32"
      fill="none"
      stroke="#2EC4C6"
      stroke-width="4"
      stroke-linecap="round"
    />
    <!-- Center focus point -->
    <circle
      cx="32"
      cy="32"
      r="4"
      fill="#3B2F8F"
    />
  </g>

  <!-- Wordmark -->
  <g transform="translate(84,56)">
    <text
      x="0"
      y="0"
      font-family="Inter, IBM Plex Sans, Arial, sans-serif"
      font-size="32"
      font-weight="600"
      fill="#0F172A"
    >
      Health
      <tspan fill="#3B2F8F">Foresight</tspan>
    </text>

    <!-- Sub-brand -->
    <text
      x="2"
      y="22"
      font-family="Inter, Arial, sans-serif"
      font-size="12"
      font-weight="500"
      fill="#64748B"
      letter-spacing="0.5"
    >
      by DataMovers
    </text>
  </g>
</svg>

